[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
# Coverage: only report production code; exclude tests, scripts, and lib
no_match_coverage = "(test|script|lib)"

[profile.default.fuzz]
runs = 10000
max_test_rejects = 65536

[profile.default.invariant]
runs = 500
depth = 100
show_metrics = true

[rpc_endpoints]
base_mainnet = "${BASE_MAINNET_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
