[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.35"
evm_version = "cancun"

# Ignore compiler warnings from dependencies we do not control
ignored_warnings_from = ["lib"]
optimizer = true
optimizer_runs = 200

# Coverage: only report production code; exclude tests, scripts, and lib
no_match_coverage = "(test|script|lib|e2e|mocks)"

[profile.default.fuzz]
runs = 10000
max_test_rejects = 65536

[profile.default.invariant]
runs = 500
depth = 100
show_metrics = true

[profile.e2e]
test = "e2e"
via_ir = true

# Disable mixed-case-function check globally: the Echidna fuzzer requires the
# echidna_ prefix on invariant functions (cannot be renamed to mixedCase).
# make lint only runs on src/ where no mixed-case violations exist.
# block-timestamp is also excluded: MozaikPaylinks uses block.timestamp for
# payment-link expiry on day/week-scale windows where validator drift is
# irrelevant, and there is no realistic alternative on EVM.
[lint]
exclude_lints = ["mixed-case-function", "asm-keccak256", "block-timestamp"]

[rpc_endpoints]
base_mainnet = "${BASE_MAINNET_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"

[etherscan]
base_mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
