name: Slither

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  slither:
    name: slither
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Slither
        run: pip install slither-analyzer==0.11.5

      # make slither runs `slither src/ --fail-high`, which blocks only
      # High-severity findings. The current output is known-benign (Medium and
      # below); see the "Continuous Integration" section in README.md
      # for the accepted-findings baseline.
      - name: Run Slither
        run: make slither
