name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # make coverage-check regenerates lcov.info and fails if src/ line
      # coverage drops below the Makefile floor (COVERAGE_MIN, currently 99%).
      - name: Check coverage floor
        run: make coverage-check

      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contracts-lcov
          path: lcov.info
