name: Echidna

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  echidna:
    name: echidna
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # Pre-compile with build-info so echidna can use the artifacts directly.
      # The echidna-action environment does not have forge available, so we must
      # compile here and pass --ignore-compile to skip recompilation in the action.
      - name: Compile contracts
        run: forge build --build-info

      # Persist each suite's corpus across runs. Cache entries are immutable, so every run saves a new one.
      - name: Cache Echidna corpus - Account
        uses: actions/cache@v6
        with:
          path: echidna-corpus-account
          key: echidna-corpus-account-${{ hashFiles('test/echidna/AccountEchidna.sol', 'echidna-account.yaml', 'src/account/**') }}-${{ github.run_id }}
          restore-keys: |
            echidna-corpus-account-${{ hashFiles('test/echidna/AccountEchidna.sol', 'echidna-account.yaml', 'src/account/**') }}-
            echidna-corpus-account-

      - name: Echidna - Account
        uses: crytic/echidna-action@v2
        with:
          echidna-workdir: .
          files: .
          contract: AccountEchidna
          config: echidna-account.yaml
          crytic-args: --ignore-compile
          echidna-version: v2.3.3

      - name: Cache Echidna corpus - Paymaster
        uses: actions/cache@v6
        with:
          path: echidna-corpus-paymaster
          key: echidna-corpus-paymaster-${{ hashFiles('test/echidna/PaymasterEchidna.sol', 'echidna-paymaster.yaml', 'src/paymaster/**') }}-${{ github.run_id }}
          restore-keys: |
            echidna-corpus-paymaster-${{ hashFiles('test/echidna/PaymasterEchidna.sol', 'echidna-paymaster.yaml', 'src/paymaster/**') }}-
            echidna-corpus-paymaster-

      - name: Echidna - Paymaster
        uses: crytic/echidna-action@v2
        with:
          echidna-workdir: .
          files: .
          contract: PaymasterEchidna
          # Needs deployContracts to plant the EntryPoint at its canonical address
          # before the paymaster harness deploys (BasePaymaster's constructor calls into it).
          config: echidna-paymaster.yaml
          crytic-args: --ignore-compile
          echidna-version: v2.3.3

      - name: Cache Echidna corpus - Paylinks
        uses: actions/cache@v6
        with:
          path: echidna-corpus-paylinks
          key: echidna-corpus-paylinks-${{ hashFiles('test/echidna/PaylinksEchidna.sol', 'echidna-paylinks.yaml', 'src/paylinks/**') }}-${{ github.run_id }}
          restore-keys: |
            echidna-corpus-paylinks-${{ hashFiles('test/echidna/PaylinksEchidna.sol', 'echidna-paylinks.yaml', 'src/paylinks/**') }}-
            echidna-corpus-paylinks-

      - name: Echidna - Paylinks
        uses: crytic/echidna-action@v2
        with:
          echidna-workdir: .
          files: .
          contract: PaylinksEchidna
          config: echidna-paylinks.yaml
          crytic-args: --ignore-compile
          echidna-version: v2.3.3

      - name: Cache Echidna corpus - CCTP
        uses: actions/cache@v6
        with:
          path: echidna-corpus-cctp
          key: echidna-corpus-cctp-${{ hashFiles('test/echidna/CCTPEchidna.sol', 'echidna-cctp.yaml', 'src/cctp/**', 'test/cctp/CCTPBaseTest.t.sol') }}-${{ github.run_id }}
          restore-keys: |
            echidna-corpus-cctp-${{ hashFiles('test/echidna/CCTPEchidna.sol', 'echidna-cctp.yaml', 'src/cctp/**', 'test/cctp/CCTPBaseTest.t.sol') }}-
            echidna-corpus-cctp-

      - name: Echidna - CCTP
        uses: crytic/echidna-action@v2
        with:
          echidna-workdir: .
          files: .
          contract: CCTPEchidna
          config: echidna-cctp.yaml
          crytic-args: --ignore-compile
          echidna-version: v2.3.3

      # Keep coverage reports out of the cached corpora. The Echidna container writes them as root.
      - name: Drop coverage reports from the corpora
        run: sudo find . -maxdepth 2 -path './echidna-corpus-*/covered.*' -delete
