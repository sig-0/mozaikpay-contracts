testMode: property
seqLen: 100
testLimit: 500000
workers: 4
corpusDir: echidna-corpus-paymaster
coverage: true
solcArgs: "--optimize --optimize-runs 200"

# Give the harness a starting balance so paymaster.deposit{value: ...} and withdrawTo can run.
# With no balance every deposit reverts, and the accounting invariant would never test anything.
balanceContract: 1000000000000000000000000

# The paymaster hardcodes the canonical EntryPoint v0.9 and BasePaymaster's constructor
# calls into it, so the EntryPoint must exist at its canonical address before the harness
# is deployed. Echidna has no cheatcodes to etch it, so deploy it here instead.
deployContracts: [ [ "0x433709009B8330FDa32311DF1C2AFA402eD8D009", "EntryPoint" ] ]
